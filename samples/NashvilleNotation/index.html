<!DOCTYPE html>
<html lang="en">

<head>
    <title>Ragamuffin Hall Nashville Notation Wheel</title>
    <script src="js/jquery-3.6.1.min.js"></script>
    <script src="js/nn.js"></script>
    <link rel="stylesheet" type="text/css" href="css/nn.css">
    <link rel="stylesheet" type="text/css" href="css/fonts.css">
    <link rel="stylesheet" type="text/css" href="css/colors.css">
</head>

<body>
    <div id="wrapper" role="main">
        <img id="numbers" class="ring" alt="progression wheel" src="img/nnInner.svg" />
        <img id="keys" class="ring" alt="key wheel" src="img/nnOuter.svg" />
        <div id="selectKey" class="dialog top">
            <h1 class="keyTxt">KEY</h1>
            <select tabindex="0" aria-label="select key">
                <label>select key</label>
                <option>C</option>
                <option>C#/Db</option>
                <option>D</option>
                <option>D#/Eb</option>
                <option>E</option>
                <option>F</option>
                <option>F#/Gb</option>
                <option>G</option>
                <option>G#/Ab</option>
                <option>A</option>
                <option>A#/Bb</option>
                <option>B</option>
            </select>
            <h1 class="transposeTxt">TRANSPOSE</h1>
            <div id="trans">0</div>
            <div id="tranUp" class="tranBtn down" role="button" tabindex="0" aria-label="up a step"></div>
            <div id="tranDown" class="tranBtn up" role="button" tabindex="0" aria-label="down a step"></div>
        </div>
        <div id="progression">
            <div id="selectProg1" class="dialog bottom">
                <select class="chordSelect" aria-label="select progression 1">
                    <option>I</option>
                    <option>II</option>
                    <option>III</option>
                    <option>IV</option>
                    <option>V</option>
                    <option>VI</option>
                    <option>VII</option>
                </select>
                <select class="modSelect" aria-label="select mod 1">
                    <option></option>
                    <option>m</option>
                    <option>7</option>
                </select>
                <div class="chordChart">
                </div>
            </div>
            <div id="selectProg2" class="dialog bottom">
                <select class="chordSelect" aria-label="select progression 2">
                    <option>I</option>
                    <option>II</option>
                    <option>III</option>
                    <option>IV</option>
                    <option>V</option>
                    <option>VI</option>
                    <option>VII</option>
                </select>
                <select class="modSelect" aria-label="select mod 2">
                    <option></option>
                    <option>m</option>
                    <option>7</option>
                </select>
                <div class="chordChart">
                </div>
            </div>
            <div id="selectProg3" class="dialog bottom">
                <select class="chordSelect" aria-label="select progression 3">
                    <option>I</option>
                    <option>II</option>
                    <option>III</option>
                    <option>IV</option>
                    <option>V</option>
                    <option>VI</option>
                    <option>VII</option>
                </select>
                <select class="modSelect" aria-label="select mod 3">
                    <option></option>
                    <option>m</option>
                    <option>7</option>
                </select>
                <div class="chordChart">
                </div>
            </div>
            <div id="selectProg4" class="dialog bottom">
                <select class="chordSelect" aria-label="select progression 4">
                    <option>I</option>
                    <option>II</option>
                    <option>III</option>
                    <option>IV</option>
                    <option>V</option>
                    <option>VI</option>
                    <option>VII</option>
                </select>
                <select class="modSelect" aria-label="select mod 4">
                    <option></option>
                    <option>m</option>
                    <option>7</option>
                </select>
                <div class="chordChart">
                </div>
            </div>

        </div>

    </div>
</body>

</html>
